{% extends 'base.html' %}
{% block title %}Change password · Nightfeed{% endblock %}
{% block content %}<div class="account-page compact-page"><section class="surface section"><div class="account-page-heading"><h1>Change password</h1><a href="{{ url_for('auth.profile') }}">Back to profile</a></div>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form class="security-form" method="post" action="{{ url_for('auth.change_password') }}">
<input type="hidden" name="auth_csrf" value="{{ auth_csrf }}">
<label>Current password<input type="password" name="current_password" required maxlength="256" autocomplete="current-password"></label>
<label>New password<input type="password" name="new_password" required minlength="15" maxlength="256" autocomplete="new-password"></label>
<label>Confirm new password<input type="password" name="confirm_password" required minlength="15" maxlength="256" autocomplete="new-password"></label>
<p>Use a unique passphrase of 15–256 characters. Changing your password signs out all other sessions.</p>
<button class="btn btn-primary">Change password</button></form></section></div>{% endblock %}
