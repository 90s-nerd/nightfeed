<dialog class="editor-dialog" data-editor-save-dialog aria-labelledby="save-preview-heading">
  <h2 id="save-preview-heading">Save without preview?</h2>
  <p>The current settings have no successful, up-to-date preview. You can still save them and refresh the feed later.</p>
  <div class="button-row"><button class="btn btn-secondary" type="button" data-dialog-stay>Keep editing</button><button class="btn btn-primary" type="button" data-dialog-save>Save without preview</button></div>
</dialog>
<dialog class="editor-dialog" data-editor-discard-dialog aria-labelledby="discard-heading">
  <h2 id="discard-heading">Discard changes?</h2>
  <p>Your unsaved changes will be lost.</p>
  <div class="button-row"><button class="btn btn-secondary" type="button" data-dialog-stay>Stay</button><button class="btn btn-danger" type="button" data-dialog-discard>Discard changes</button></div>
</dialog>
