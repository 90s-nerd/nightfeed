{% extends "base.html" %}

{% block title %}{{ profile.feed_title }} XML · Nightfeed{% endblock %}

{% block page_header %}
<header class="topbar">
  <div class="page-title">
    <h1>{{ profile.feed_title }} XML</h1>

  </div>
  <div class="topbar-actions">
    <a class="btn btn-secondary" href="/profiles/{{ profile.id }}">Back to feed</a>
    <a class="btn btn-primary" href="{{ feed_url }}" target="_blank" rel="noopener noreferrer">Open raw XML</a>
  </div>
</header>
{% endblock %}

{% block content %}
<section class="surface section">
  <div class="section-head">
    <div>
      <div class="section-kicker">Formatted output</div>
      <h2>RSS XML</h2>

    </div>
  </div>

  <div class="xml-output">
    <pre><span class="xml-view">{{ xml_payload | safe }}</span></pre>
  </div>
</section>


{% endblock %}
