{% extends 'base.html' %}
{% block title %}Tasks · Nightfeed{% endblock %}
{% block page_header %}<header class="topbar"><div class="page-title"><h1>Tasks</h1><p>Watch for new topics as your feeds refresh.</p></div><div class="topbar-actions"><button class="btn btn-primary" data-tasks-create>New task</button></div></header>{% endblock %}
{% block content %}<section class="surface section task-page" data-tasks-page><div class="task-filters" role="group" aria-label="Task status"><button type="button" data-task-filter="all" aria-pressed="true">All</button><button type="button" data-task-filter="active" aria-pressed="false">Active</button><button type="button" data-task-filter="paused" aria-pressed="false">Paused</button><button type="button" data-task-filter="completed" aria-pressed="false">Completed</button><button type="button" data-task-filter="archived" aria-pressed="false">Archived</button></div><p data-tasks-status class="meta" role="status"></p><div data-tasks-content></div></section>{% endblock %}
