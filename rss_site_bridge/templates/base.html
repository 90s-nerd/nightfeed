<!doctype html>
<html lang="en">
  <head>
    <meta name="downloader-csrf" content="{{ downloader_csrf }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nightfeed{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='nightfeed-mark.svg') }}">
    <style>
      :root {
        --bg: #0d121a;
        --bg-soft: #121824;
        --panel: #161d29;
        --panel-2: #1a2230;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text: #edf2fb;
        --muted: #95a0b3;
        --accent: #f28b4b;
        --accent-strong: #d46f31;
        --accent-soft: rgba(242, 139, 75, 0.14);
        --success: #3fc48a;
        --danger: #eb6c68;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font: 400 15px/1.45 "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(242, 139, 75, 0.12), transparent 20%),
          linear-gradient(180deg, #0a0f16 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100dvh;
        overflow-y: auto;
        background: rgba(15, 20, 29, 0.92);
        border-right: 1px solid var(--line);
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .sidebar-menu {
        min-height: 0;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .mobile-nav-toggle {
        display: none;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
      }

      .mobile-nav-toggle span {
        display: block;
        width: 18px;
        height: 2px;
        margin: 4px auto;
        border-radius: 999px;
        background: currentColor;
        transition: transform 160ms ease, opacity 160ms ease;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: block;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      .brand-copy { min-width: 0; }

      .brand-copy strong {
        display: block;
        font-size: 1.08rem;
        letter-spacing: -0.035em;
      }

      .brand-copy span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .nav-list {
        display: grid;
        gap: 8px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 12px;
        border-radius: 12px;
        color: var(--muted);
        border: 1px solid transparent;
      }

      .nav-link.active,
      .nav-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--line);
      }

      .sidebar-header-actions { display: flex; align-items: center; gap: 8px; }
      .mobile-settings-link { display: none; }


      .main {
        min-width: 0;
        padding: 18px 22px 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .page-title h1 {
        margin: 0;
        font-size: 1.9rem;
        letter-spacing: -0.04em;
        overflow-wrap: anywhere;
      }

      .page-title { min-width: 0; }

      .page-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .topbar-actions,
      .button-row,
      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .topbar-actions form,
      .button-row form {
        margin: 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:disabled {
        cursor: wait;
        opacity: 0.78;
        transform: none;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-strong);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--line);
        color: var(--text);
      }

      .btn-danger {
        background: rgba(235, 108, 104, 0.1);
        border-color: rgba(235, 108, 104, 0.24);
        color: #ffd9d8;
      }

      .surface {
        background: linear-gradient(180deg, rgba(25, 32, 46, 0.94), rgba(18, 24, 36, 0.96));
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .section {
        padding: 20px;
      }

      .section-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .section-kicker {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
      }

      .section-head h2 {
        margin: 4px 0 0;
        font-size: 1.2rem;
        letter-spacing: -0.03em;
      }

      .section-head p,
      .meta,
      .empty-state,
      .field label,
      .notice p {
        color: var(--muted);
      }

      .section-head p {
        margin: 6px 0 0;
      }

      .stat-grid,
      .detail-metrics,
      .compose-grid {
        display: grid;
        gap: 12px;
      }

      .compose-grid {
        align-items: start;
      }

      .stat-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .detail-metrics {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .stat-card,
      .metric-card {
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .metric-value {
        margin-top: 6px;
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .feed-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }

      .feed-card,
      .item-card,
      .preview-card {
        display: block;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid var(--line);
        transition: transform 140ms ease, border-color 140ms ease;
      }

      .feed-card:hover,
      .item-card:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
      }

      .feed-card h3,
      .item-card h3,
      .preview-card h3 {
        margin: 0;
        font-size: 1.02rem;
        letter-spacing: -0.02em;
      }

      .feed-url,
      .meta-row,
      .item-footer,
      .copy-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .meta-row,
      .item-footer {
        justify-content: space-between;
      }

      .feed-url {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
        word-break: break-all;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #ffc59f;
        font-size: 0.76rem;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        font-size: 0.76rem;
        color: var(--muted);
      }

      .status-badge.ok {
        color: var(--success);
        background: rgba(63, 196, 138, 0.1);
        border-color: rgba(63, 196, 138, 0.22);
      }

      .status-badge.error {
        color: var(--danger);
        background: rgba(235, 108, 104, 0.1);
        border-color: rgba(235, 108, 104, 0.22);
      }

      .status-badge.idle {
        color: #c9d2e3;
        background: rgba(149, 160, 179, 0.1);
        border-color: rgba(149, 160, 179, 0.18);
      }

      .status-badge.disabled {
        color: #d1c4a5;
        background: rgba(188, 168, 117, 0.12);
        border-color: rgba(188, 168, 117, 0.22);
      }

      .status-icon {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid currentColor;
        color: currentColor;
        font-size: 0.72rem;
        font-weight: 800;
        line-height: 1;
        flex: 0 0 16px;
      }

      .copy-row {
        margin-top: 18px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        justify-content: space-between;
      }

      .copy-meta {
        min-width: 0;
        flex: 1 1 280px;
      }

      .copy-label {
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .copy-value {
        margin-top: 4px;
        word-break: break-all;
      }

      .list-stack {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 0.86rem;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
      }

      .field textarea {
        min-height: 110px;
        resize: vertical;
        line-height: 1.45;
      }

      .field-hint {
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .refresh-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 2000;
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: min(440px, calc(100vw - 32px));
        padding: 14px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: #18202d;
        color: var(--text);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      .refresh-toast[hidden] { display: none; }
      .refresh-toast[data-kind="error"] { border-color: #ef7777; }
      .refresh-toast button {
        flex-shrink: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 4px;
        font-size: 1.25rem;
      }
      .refresh-toast-message { overflow-wrap: anywhere; }
      .refresh-pending { position: relative; color: transparent !important; }
      .refresh-pending::after {
        content: "";
        position: absolute;
        left: calc(50% - 8px);
        top: calc(50% - 8px);
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @media (max-width: 640px) {
        .refresh-toast { right: 16px; bottom: 16px; left: 16px; max-width: none; }
      }

      .feed-settings-panel {
        position: sticky;
        top: 20px;
        max-height: var(--settings-available-height, calc(100dvh - 140px));
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .feed-settings-panel > .section-head { flex-shrink: 0; }
      .feed-settings-scroll {
        overflow-y: auto;
        min-height: 0;
        scrollbar-gutter: stable;
        padding-right: 8px;
      }
      .feed-settings-actions {
        flex-shrink: 0;
        padding: 0 0 16px;
        margin: 0 0 12px;
        border-bottom: 1px solid var(--line);
      }
      .feed-settings-advanced, .feed-preview {
        margin: 16px 0;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .feed-settings-advanced > summary, .feed-preview > summary {
        cursor: pointer;
        font-weight: 600;
        padding: 4px 0 12px;
      }
      .feed-preview-content { padding-top: 8px; }
      .feed-preview .list-stack { max-height: 50dvh; overflow-y: auto; }
      @media (max-width: 1100px) {
        .feed-settings-panel { position: static; max-height: none; }
        .feed-settings-scroll { overflow-y: visible; padding-right: 0; }
        .feed-settings-panel .feed-settings-actions {
          position: fixed;
          z-index: 40;
          left: 12px;
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom, 0px));
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: auto;
          margin: 0;
          padding: 12px;
          border: 1px solid var(--line-strong);
          border-radius: 16px;
          background: #151c28;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .feed-settings-actions .btn { min-height: 44px; width: 100%; }
        body:has(.feed-settings-panel) .main {
          padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
        }
        body:has(.feed-settings-panel) .refresh-toast {
          bottom: calc(100px + env(safe-area-inset-bottom, 0px));
        }
      }

      .downloader-settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .downloader-dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 20px; border: 1px solid var(--line-strong); border-radius: 18px; background: #151c28; color: var(--text); }
      .downloader-dialog::backdrop { background: rgba(0,0,0,0.65); }
      .downloader-dialog form { display: flex; flex-direction: column; max-height: calc(100dvh - 76px); }
      .downloader-dialog .section-head, .downloader-dialog-actions { flex-shrink: 0; }
      .downloader-dialog-body { overflow-y: auto; min-height: 0; }
      .downloader-dialog input, .downloader-dialog select { font-size: 16px; }
      .downloader-dialog .downloader-dialog-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 12px; }
      .downloader-dialog .btn, .safe-download-actions .btn { min-height: 44px; }
      .safe-download-actions { display: grid; grid-template-columns: minmax(80px, 0.7fr) minmax(0, 1.3fr); align-items: stretch; gap: 8px; width: 100%; }
      .safe-download-actions .btn { width: 100%; min-width: 0; padding: 10px 12px; white-space: normal; overflow-wrap: break-word; word-break: normal; text-align: center; }
      .safe-download-actions .btn:only-child { grid-column: 1 / -1; }
      .safe-download-actions .btn:last-child:nth-child(3) { grid-column: 1 / -1; }
      @media (max-width: 980px) { .downloader-settings-grid { grid-template-columns: minmax(0, 1fr); } }
      @media (max-width: 640px) {
        .downloader-dialog { margin: auto 0 0; width: 100%; max-width: 100%; max-height: calc(100dvh - 12px); border-radius: 18px 18px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
        .downloader-dialog form { max-height: calc(100dvh - 60px - env(safe-area-inset-bottom, 0px)); }
        .safe-browser-download:has(.safe-download-actions) { flex-direction: column; align-items: stretch; }

      }

      .feed-filter-group {
        min-width: 0;
        margin: 0;
        padding: 12px 14px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .feed-filter-group legend {
        padding: 0 6px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .feed-filter-options {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
      }

      .feed-filter-options .check-option {
        align-items: center;
      }

      .filter-actions,
      .pagination-actions {
        margin-top: 20px;
        align-items: center;
      }

      .pagination-actions:empty {
        display: none;
      }

      .check-stack {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .check-option {
        display: inline-grid;
        grid-template-columns: 20px auto;
        gap: 10px;
        align-items: start;
        color: var(--text);
        cursor: pointer;
        justify-content: start;
      }

      .check-option input {
        appearance: none;
        width: 20px;
        height: 20px;
        min-height: 20px;
        padding: 0;
        margin: 0;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.05);
        display: inline-grid;
        place-items: center;
        flex: 0 0 20px;
        transition: background 140ms ease, border-color 140ms ease;
      }

      .check-option input::after {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg) translate(1px, -1px);
      }

      .check-option input:checked {
        background: var(--accent);
        border-color: rgba(242, 139, 75, 0.5);
      }

      .check-option input:checked::after {
        border-left-color: #ffffff;
        border-bottom-color: #ffffff;
      }

      .check-option span {
        line-height: 1.4;
      }

      .check-copy {
        display: grid;
        gap: 2px;
      }

      .check-copy strong {
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .check-copy span {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .notice-soft {
        margin-top: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
      }

      .empty-state {
        padding: 18px;
        border-radius: 16px;
        border: 1px dashed var(--line-strong);
        text-align: center;
      }

      .loading-note {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(242, 139, 75, 0.2);
        background: rgba(242, 139, 75, 0.08);
        color: #ffd5b7;
        display: none;
      }

      .loading-note.active {
        display: block;
      }

      .loading-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffbe92;
      }

      .loading-status {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .loading-status strong {
        font-size: 0.95rem;
        letter-spacing: -0.02em;
      }

      .loading-status span {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .loading-dots {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .loading-dots i {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 213, 183, 0.34);
        animation: pulse-dot 1.1s ease-in-out infinite;
      }

      .loading-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }

      .loading-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-top-color: currentColor;
        animation: spin 0.7s linear infinite;
        flex: 0 0 14px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-dot {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }

        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .notice {
        margin-top: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(235, 108, 104, 0.08);
        border: 1px solid rgba(235, 108, 104, 0.18);
      }

      .error-text {
        margin: 12px 0 0;
        color: #ff9f9d;
      }

      .link-text {
        color: #ffbc8f;
      }

      .item-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .link-text:hover,
      .danger-link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .danger-link {
        color: #ff7773;
      }

      .inline-form {
        margin: 0;
      }

      .safe-browser-shell {
        position: relative;
        overflow: hidden;
      }

      .safe-browser-toast {
        position: fixed;
        z-index: 100;
        bottom: 20px;
        right: 16px;
        max-width: min(320px, calc(100% - 32px));
        padding: 11px 14px;
        border: 1px solid rgba(63, 196, 138, 0.32);
        border-radius: 12px;
        color: #d9ffed;
        background: rgba(24, 79, 58, 0.96);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .safe-browser-toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .safe-browser-toolbar {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(10, 15, 22, 0.72);
      }

      .safe-browser-nav,
      .safe-browser-address {
        display: flex;
        gap: 8px;
      }

      .safe-browser-address {
        flex: 1;
      }

      .safe-browser-toolbar-actions,
      .safe-browser-device-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .safe-browser-toolbar-actions {
        flex: 0 0 auto;
      }

      .safe-browser-device-toggle {
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.025);
      }

      .safe-browser-device-option {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 9px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }

      .safe-browser-device-option:hover,
      .safe-browser-device-option.is-active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }

      .safe-browser-device-option.is-active {
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }

      .safe-browser-device-option svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .safe-browser-download-menu {
        position: relative;
        flex: 0 0 auto;
      }

      .safe-browser-download-toggle {
        position: relative;
        width: 42px;
        padding: 0;
      }

      .safe-browser-download-toggle svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .safe-browser-download-badge {
        position: absolute;
        top: -7px;
        right: -7px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border: 2px solid #101722;
        border-radius: 999px;
        color: #fff;
        background: var(--danger);
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 16px;
      }

      .safe-browser-download-badge.is-updated {
        animation: download-badge-pulse 700ms ease-out;
      }

      @keyframes download-badge-pulse {
        0% { transform: scale(0.65); }
        45% { transform: scale(1.28); }
        100% { transform: scale(1); }
      }

      .safe-browser-download-popover {
        position: absolute;
        z-index: 20;
        top: calc(100% + 10px);
        right: 0;
        width: min(360px, calc(100vw - 44px));
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: #171f2c;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.46);
      }

      .safe-browser-download-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .safe-browser-download-head span {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .safe-browser-download-list {
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .safe-browser-address input {
        min-width: 0;
        flex: 1;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line-strong);
        color: var(--text);
        background: rgba(255, 255, 255, 0.045);
      }

      .safe-browser-status {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px 18px;
        padding: 9px 14px;
        color: var(--muted);
        font-size: 0.82rem;
        border-bottom: 1px solid var(--line);
      }

      .safe-browser-status span:first-child {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }

      .safe-browser-viewport {
        position: relative;
        width: 100%;
        overflow: hidden;
        background: #fff;
      }

      .safe-browser-viewport img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1280 / 800;
        cursor: default;
        outline: none;
        user-select: none;
        touch-action: none;
        -webkit-user-drag: none;
      }

      .safe-browser-viewport img.is-touch-scrolling {
        cursor: grabbing;
      }

      .safe-browser-viewport img:focus {
        box-shadow: inset 0 0 0 3px var(--accent);
      }

      .safe-click-feedback {
        position: absolute; width: 28px; height: 28px; margin: -14px;
        border: 3px solid #ff8c42; border-radius: 50%; pointer-events: none;
        background: rgba(255,140,66,.25); animation: safe-click .45s ease-out forwards;
      }
      @keyframes safe-click { to { transform: scale(2); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .safe-click-feedback { animation: none; } }
      .safe-browser-loading {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 7px 10px;
        border-radius: 10px;
        color: #fff;
        background: rgba(10, 15, 22, 0.8);
        font-size: 0.8rem;
      }

      .safe-browser-hint {
        margin: 0;
        padding: 10px 14px;
        color: var(--muted);
        font-size: 0.82rem;
        border-top: 1px solid var(--line);
      }

      .safe-browser-download {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        min-width: 0;
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
      }

      .safe-browser-download p {
        margin: 3px 0 0;
      }

      .safe-browser-download > div {
        width: 100%;
        min-width: 0;
      }

      .safe-browser-download-name {
        display: flex;
        min-width: 0;
        max-width: 100%;
        white-space: nowrap;
      }

      .safe-browser-download-stem {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .safe-browser-download-extension {
        flex: 0 0 auto;
      }

      .safe-browser-download-save {
        flex: 0 0 auto;
        color: #ffc59f;
        font-weight: 600;
      }

      .safe-browser-install {
        overflow-x: auto;
        padding: 14px;
        border-radius: 12px;
        background: #0a0f16;
        border: 1px solid var(--line);
      }

      @media (max-width: 980px) {
        .app-shell { display: block; }

        .sidebar {
          position: sticky;
          z-index: 50;
          top: 0;
          min-height: 64px;
          height: auto;
          overflow: visible;
          padding: 10px 16px;
          border-right: none;
          border-bottom: 1px solid var(--line);
          background: rgba(13, 18, 26, 0.96);
          backdrop-filter: blur(18px);
        }

        .brand-mark {
          width: 40px;
          height: 40px;
          border-radius: 13px;
        }

        .brand-copy span { display: none; }

        .mobile-settings-link {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 44px;
          padding: 0 12px;
          border: 1px solid var(--line);
          border-radius: 12px;
          color: var(--text);
        }

        .nav-link { min-height: 44px; }
        .mobile-nav-toggle { min-width: 44px; min-height: 44px; }

        .mobile-nav-toggle {
          display: block;
          flex: 0 0 auto;
        }

        .sidebar-menu {
          position: fixed;
          z-index: 51;
          top: 64px;
          left: 12px;
          right: 12px;
          min-height: auto;
          max-height: calc(100dvh - 96px - env(safe-area-inset-bottom, 0px));
          padding: 10px;
          overflow: auto;
          border: 1px solid var(--line-strong);
          border-radius: 16px;
          background: #151c28;
          box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
          transform: translateY(-10px) scale(0.98);
          transform-origin: top center;
          transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
        }

        .sidebar.nav-open .sidebar-menu {
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
          transform: translateY(0) scale(1);
        }

        .sidebar.nav-open .mobile-nav-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .sidebar.nav-open .mobile-nav-toggle span:nth-child(2) { opacity: 0; }
        .sidebar.nav-open .mobile-nav-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

        .mobile-nav-backdrop {
          position: fixed;
          z-index: 49;
          inset: 64px 0 0;
          background: rgba(0, 0, 0, 0.5);
          backdrop-filter: blur(2px);
        }

        .stat-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .compose-grid {
          grid-template-columns: 1fr !important;
        }
      }

      @media (max-width: 720px) {
        .main {
          padding: 16px 14px 28px;
        }

        .topbar,
        .section-head,
        .item-footer,
        .copy-row {
          flex-direction: column;
          align-items: stretch;
        }

        .topbar {
          gap: 12px;
          margin-bottom: 14px;
        }

        .page-title h1 { font-size: 1.55rem; }
        .page-title p { font-size: 0.86rem; }

        .topbar-actions,
        .form-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: 100%;
          gap: 8px;
        }

        .topbar-actions .btn,
        .topbar-actions form,
        .topbar-actions form .btn,
        .form-actions .btn,
        .form-actions form,
        .form-actions form .btn {
          width: 100%;
        }

        .topbar-actions > :last-child:nth-child(odd),
        .form-actions > :last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }

        .section {
          padding: 15px;
        }

        .surface { border-radius: 17px; }
        .section-head { margin-bottom: 14px; }

        .feed-grid { grid-template-columns: minmax(0, 1fr); }

        .feed-card,
        .item-card,
        .preview-card {
          padding: 15px;
          border-radius: 15px;
        }

        .stat-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
        }

        .stat-card,
        .metric-card {
          min-width: 0;
          padding: 12px;
        }

        .metric-value { font-size: 1.1rem; }

        .detail-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .meta-row {
          gap: 8px;
        }

        .item-actions {
          flex-wrap: wrap;
          gap: 10px 16px;
        }

        .field input,
        .field select,
        .field textarea {
          min-height: 46px;
          font-size: 16px;
        }

        .safe-browser-toolbar,
        .safe-browser-address {
          flex-direction: column;
        }

        .safe-browser-toolbar {
          gap: 8px;
          padding: 10px;
        }

        .safe-browser-address {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .safe-browser-address input {
          min-height: 44px;
          font-size: 16px;
        }

        .safe-browser-address .btn {
          min-width: 64px;
        }

        .safe-browser-download-menu {
          align-self: auto;
        }

        .safe-browser-toolbar-actions {
          padding-top: 2px;
          justify-content: flex-end;
        }

        .safe-browser-status span:first-child {
          flex: 1 0 100%;
        }

        .safe-browser-status {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px 12px;
          padding: 9px 12px;
        }

        .safe-browser-toast {
          right: 12px;
          bottom: 12px;
          max-width: calc(100vw - 24px);
        }

        .safe-browser-nav .btn {
          flex: 1;
        }

        .safe-browser-download {
          align-items: stretch;
          flex-direction: column;
        }

        .safe-browser-download-save {
          min-height: 38px;
          display: inline-flex;
          align-items: center;
        }

        .safe-browser-hint { padding-inline: 12px; }
      }

      @media (max-width: 390px) {
        .main { padding-inline: 10px; }
        .sidebar { padding-inline: 12px; }
        .topbar-actions,
        .form-actions { grid-template-columns: minmax(0, 1fr); }
        .stat-grid { grid-template-columns: minmax(0, 1fr); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-mobile-nav>
        <div class="sidebar-header">
          <a class="brand" href="/" aria-label="Nightfeed home">
            <img class="brand-mark" src="{{ url_for('static', filename='nightfeed-mark.svg') }}" width="44" height="44" alt="" aria-hidden="true">
            <div class="brand-copy">
              <strong>Nightfeed</strong>
              <span>Your web. One feed.</span>
            </div>
          </a>
          <div class="sidebar-header-actions">
            <a class="mobile-settings-link" href="/settings" aria-label="App settings">Settings</a>
          <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar-menu" data-mobile-nav-toggle>
            <span></span><span></span><span></span>
          </button>
          </div>
        </div>

        <div class="sidebar-menu" id="sidebar-menu" data-mobile-nav-panel>
          <nav class="nav-list" aria-label="Primary navigation">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Timeline</a>
            <a class="nav-link {% if request.path == '/feeds' %}active{% endif %}" href="/feeds">My Feeds</a>
            <a class="nav-link {% if request.path.startswith('/notifications') %}active{% endif %}" href="/notifications">
              Notifications
              {% if g.unread_notification_count %}
              <span class="pill" data-unread-notifications>{{ g.unread_notification_count }}</span>
              {% endif %}
            </a>
            <a class="nav-link {% if request.path.startswith('/settings') %}active{% endif %}" href="/settings">Settings</a>
          </nav>
        </div>
      </aside>
      <div class="mobile-nav-backdrop" data-mobile-nav-backdrop hidden></div>

      <main class="main">
        {% block page_header %}{% endblock %}
        {% block content %}{% endblock %}
      </main>
    </div>
    <div class="refresh-toast" data-refresh-toast hidden>
      <span class="refresh-toast-message" role="status" aria-live="polite" aria-atomic="true"></span>
      <button type="button" aria-label="Dismiss notification">×</button>
    </div>
    <script>
      // Delegate so confirmation also applies to content replaced after refresh.
      document.addEventListener('submit', event => {
        const message = event.target.dataset.confirm;
        if (message && !window.confirm(message)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script>
      (() => {
        const toast = document.querySelector('[data-refresh-toast]');
        let timer;
        const dismiss = () => { clearTimeout(timer); toast.hidden = true; };
        toast.querySelector('button').addEventListener('click', dismiss);
        window.showRefreshToast = (message, kind = 'success') => {
          clearTimeout(timer);
          toast.dataset.kind = kind;
          toast.querySelector('[role="status"]').textContent = message;
          toast.hidden = false;
          if (kind === 'success') timer = setTimeout(dismiss, 6000);
        };
      })();
    </script>
    <script>
      const mobileNav = document.querySelector("[data-mobile-nav]");
      const mobileNavToggle = document.querySelector("[data-mobile-nav-toggle]");
      const mobileNavBackdrop = document.querySelector("[data-mobile-nav-backdrop]");

      const setMobileNavOpen = (open) => {
        if (!mobileNav || !mobileNavToggle || !mobileNavBackdrop) return;
        mobileNav.classList.toggle("nav-open", open);
        mobileNavToggle.setAttribute("aria-expanded", String(open));
        mobileNavToggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
        mobileNavBackdrop.hidden = !open;
      };

      mobileNavToggle?.addEventListener("click", () => {
        setMobileNavOpen(!mobileNav.classList.contains("nav-open"));
      });
      mobileNavBackdrop?.addEventListener("click", () => setMobileNavOpen(false));
      mobileNav?.querySelectorAll(".nav-link").forEach((link) => {
        link.addEventListener("click", () => setMobileNavOpen(false));
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMobileNavOpen(false);
      });
      window.matchMedia("(min-width: 981px)").addEventListener("change", (event) => {
        if (event.matches) setMobileNavOpen(false);
      });

      const previewDebugParams = new URLSearchParams(window.location.search);
      if (previewDebugParams.get("preview_debug") === "1") {
        window.localStorage.setItem("nightfeed.previewDebug", "1");
      } else if (previewDebugParams.get("preview_debug") === "0") {
        window.localStorage.removeItem("nightfeed.previewDebug");
      }

      const previewDebugEnabled = window.localStorage.getItem("nightfeed.previewDebug") === "1";

      const logPreviewDebug = (label, payload) => {
        if (!previewDebugEnabled) {
          return;
        }
        console.log(`[Nightfeed Preview] ${label}`, payload);
      };

      if (previewDebugEnabled) {
        console.log("[Nightfeed Preview] debug mode enabled");
      }

      const setButtonLoadingState = (form, submitter) => {
        if (!submitter || !submitter.dataset.loadingLabel) {
          return;
        }

        const originalLabel = submitter.dataset.originalLabel || submitter.textContent.trim();
        submitter.dataset.originalLabel = originalLabel;
        submitter.disabled = true;
        submitter.innerHTML = '<span class="spinner" aria-hidden="true"></span>' + submitter.dataset.loadingLabel;

        Array.from(form.elements).filter((element) => element.tagName === "BUTTON").forEach((button) => {
          if (button !== submitter) {
            button.disabled = true;
          }
        });

        const loadingNote = form.parentElement.querySelector("[data-loading-note]");
        if (loadingNote) {
          loadingNote.classList.add("active");
        }
      };

      const stopLoadingStatus = (form) => {
        if (form._previewSource) {
          form._previewSource.close();
          form._previewSource = null;
        }
      };

      const updateLoadingStatus = (form, stage) => {
        const loadingNote = form.parentElement.querySelector("[data-loading-note]");
        if (!loadingNote) {
          return;
        }

        const title = loadingNote.querySelector("[data-loading-title]");
        const detail = loadingNote.querySelector("[data-loading-detail]");
        if (title) {
          title.textContent = stage.title;
        }
        if (detail) {
          detail.textContent = stage.detail;
        }
      };

      const startLoadingStatus = (form) => {
        updateLoadingStatus(form, {
          title: "Connecting",
          detail: "Waiting for the preview stream to start.",
        });
      };

      const resetButtonLoadingState = (form, submitter) => {
        if (!submitter) {
          return;
        }

        const originalLabel = submitter.dataset.originalLabel;
        if (originalLabel) {
          submitter.textContent = originalLabel;
        }

        Array.from(form.elements).filter((element) => element.tagName === "BUTTON").forEach((button) => {
          button.disabled = false;
        });

        const loadingNote = form.parentElement.querySelector("[data-loading-note]");
        if (loadingNote) {
          loadingNote.classList.remove("active");
        }
        stopLoadingStatus(form);
        updateLoadingStatus(form, {
          title: "Connecting",
          detail: "Waiting for the preview stream to start.",
        });
      };

      const escapeHtml = (value) => String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

      const renderPreviewItems = (targetName, payload) => {
        const list = document.querySelector(`[data-preview-list="${targetName}"]`);
        if (!list) {
          return;
        }

        const panel = document.querySelector(`[data-preview-panel="${targetName}"]`);
        const count = panel ? panel.querySelector("[data-preview-count]") : null;
        const error = panel ? panel.querySelector("[data-preview-error]") : null;
        const empty = panel ? panel.querySelector("[data-preview-empty]") : null;

        const items = payload.items || [];
        if (count) {
          count.textContent = `${items.length} items found with the current selectors.`;
        }

        if (payload.error) {
          list.hidden = true;
          list.innerHTML = "";
          if (error) {
            error.hidden = false;
            error.textContent = payload.error;
          }
          if (empty) {
            empty.hidden = true;
          }
          return;
        }

        if (error) {
          error.hidden = true;
          error.textContent = "";
        }

        if (!items.length) {
          list.hidden = true;
          list.innerHTML = "";
          if (empty) {
            empty.hidden = false;
          }
          return;
        }

        list.hidden = false;
        if (empty) {
          empty.hidden = true;
        }
        list.innerHTML = items.map((item) => `
          <article class="preview-card">
            <h3>${escapeHtml(item.title)}</h3>
            <p class="meta">${escapeHtml(item.link)}</p>
          </article>
        `).join("");
      };

      const buildPreviewStreamUrl = (baseUrl, form) => {
        const params = new URLSearchParams();
        new FormData(form).forEach((value, key) => {
          params.append(key, value);
        });
        return `${baseUrl}?${params.toString()}`;
      };

      const runPreviewWithSse = (form, submitter) => new Promise((resolve) => {
        const streamUrl = submitter.dataset.previewStreamUrl;
        if (!streamUrl || typeof EventSource === "undefined") {
          resolve(false);
          return;
        }

        const source = new EventSource(buildPreviewStreamUrl(streamUrl, form));
        form._previewSource = source;

        source.addEventListener("stage", (event) => {
          const payload = JSON.parse(event.data);
          logPreviewDebug("stage", payload);
          updateLoadingStatus(form, payload);
        });

        source.addEventListener("result", (event) => {
          const payload = JSON.parse(event.data);
          logPreviewDebug("result", payload);
          renderPreviewItems(submitter.dataset.previewTarget, payload);
        });

        source.addEventListener("error", (event) => {
          let payload = { error: "Preview failed. Try again.", items: [] };
          if (event.data) {
            payload = JSON.parse(event.data);
          }
          logPreviewDebug("error", payload);
          renderPreviewItems(submitter.dataset.previewTarget, payload);
        });

        source.addEventListener("done", () => {
          logPreviewDebug("done", {});
          source.close();
          form._previewSource = null;
          resolve(true);
        });

        source.onerror = () => {
          logPreviewDebug("transport-error", {});
          if (form._previewSource) {
            renderPreviewItems(submitter.dataset.previewTarget, {
              items: [],
              error: "Preview stream disconnected. Try again.",
            });
            source.close();
            form._previewSource = null;
            resolve(true);
          }
        };
      });

      document.querySelectorAll("[data-loading-form]").forEach((form) => {
        form.addEventListener("submit", async (event) => {
          const submitter = event.submitter;
          if (!submitter) {
            return;
          }

          if (form.dataset.loading === "1") {
            event.preventDefault();
            return;
          }

          if (submitter.dataset.previewUrl) {
            event.preventDefault();
            form.dataset.loading = "1";
            setButtonLoadingState(form, submitter);
            startLoadingStatus(form);

            try {
              const usedSse = await runPreviewWithSse(form, submitter);
              if (!usedSse) {
                const response = await fetch(submitter.dataset.previewUrl, {
                  method: "POST",
                  headers: {
                    "X-Requested-With": "XMLHttpRequest",
                  },
                  body: new FormData(form),
                });
                const payload = await response.json();
                renderPreviewItems(submitter.dataset.previewTarget, payload);
              }
            } catch (error) {
              renderPreviewItems(submitter.dataset.previewTarget, {
                items: [],
                error: "Preview failed. Try again.",
              });
            } finally {
              form.dataset.loading = "0";
              resetButtonLoadingState(form, submitter);
            }
            return;
          }

          if (!submitter.dataset.loadingLabel) {
            return;
          }

          form.dataset.loading = "1";
          setButtonLoadingState(form, submitter);
        });
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
