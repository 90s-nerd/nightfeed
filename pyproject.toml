[project]
name = "nightfeed"
version = "0.4.2"
description = "Save site extraction profiles and publish RSS feeds from topic listing pages."
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "Flask>=3.1.0",
  "gunicorn>=23.0.0",
  "tzdata>=2025.2",
  "croniter>=6.0.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.53.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rss_site_bridge*"]

[tool.setuptools.package-data]
rss_site_bridge = ["templates/*.html", "templates/components/*.html", "static/*.svg", "static/*.css", "static/*.js"]

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"
