[project]
name = "nightfeed"
version = "0.7.0"
description = "Save site extraction profiles and publish RSS feeds from topic listing pages."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "Flask>=3.1.3",
  "gunicorn>=23.0.0",
  "tzdata>=2025.2",
  "croniter>=6.0.0",
  "cryptography>=50.0.2",
  "pywebpush>=2.0.0,<3",
  "Authlib>=1.8.0,<2",
  "requests>=2.33.0,<3",
  "Werkzeug>=3.1.9",
  "Jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
  "urllib3>=2.8.0,<3",
  "joserfc>=1.7.5,<2",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.53.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rss_site_bridge*"]

[tool.setuptools.package-data]
rss_site_bridge = ["templates/*.html", "templates/components/*.html", "static/*.svg", "static/*.png", "static/*.css", "static/*.js"]

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"
